name: Build model and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variants:
        description: "Model builds to publish (comma separated: qdq8, q8e8, q4e8)"
        default: "q8e8,q4e8"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VARIANTS: ${{ inputs.variants || 'q8e8,q4e8' }}
  HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache keys cannot contain commas, so turn q8e8,q4e8 into q8e8-q4e8.
      - name: Cache key for the variant list
        run: echo "VARIANTS_KEY=${VARIANTS//,/-}" >> "$GITHUB_ENV"

      # The converted model is rebuilt only when the conversion code, its pinned dependencies or the variant list change.
      - name: Restore converted model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            build/model
            build/verify_report.md
            build/verify_report.json
          key: laya-model-${{ hashFiles('scripts/build_model.py', 'requirements-build.txt') }}-${{ env.VARIANTS_KEY }}

      - name: Install Python dependencies
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements-build.txt

      - name: Convert and quantize the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/build_model.py --variants "$VARIANTS"

      - name: Check the converted model against PyTorch
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/verify_model.py

      - name: Install web dependencies
        run: npm ci

      - name: Check the JavaScript port builds identical token sequences
        run: node tests/seq_parity.mjs

      - name: Assemble a full local copy of the site for testing
        run: node scripts/prepare_site.mjs --out dist-test

      - name: Browser smoke test (headless Chromium, WASM)
        env:
          SMOKE_DIST: dist-test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py

      # Optional: keep the model on Hugging Face instead of inside the Pages site.
      # Set the repository variable HF_MODEL_REPO (for example yourname/laya-en-web) and the secret HF_TOKEN (write access).
      - name: Upload the model to Hugging Face
        if: env.HF_MODEL_REPO != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python scripts/upload_to_hf.py "$HF_MODEL_REPO"

      - name: Assemble the site to deploy
        run: |
          if [ -n "$HF_MODEL_REPO" ]; then
            node scripts/prepare_site.mjs --external-model-base "https://huggingface.co/${HF_MODEL_REPO}/resolve/main/"
          else
            node scripts/prepare_site.mjs
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
